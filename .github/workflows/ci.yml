name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (offline, mocked n8n API)
        run: python3 -m unittest discover -s tests -v
      - name: Build the sample workflow offline
        run: python3 -m arcturion_workflows build examples/nightly-digest.json --out workflows-out
